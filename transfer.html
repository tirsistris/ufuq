<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أفق — تحويل</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#F7F5F1;--ink:#14181A;--muted:#6E7679;--avail:#0B4F55;--line:#E2DED7;--clay:#9C4A2F;--spent:#D8D5CF;--promised:#EFEBE4}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;letter-spacing:0;-webkit-font-smoothing:antialiased;background:#E8E6E1;display:flex;align-items:center;justify-content:center;gap:20px;flex-direction:column;overflow:hidden}
  button{font-family:inherit;letter-spacing:0;cursor:pointer}
  .num{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
  .ltr{direction:ltr;unicode-bidi:isolate}

  .frame{width:390px;height:844px;border-radius:54px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 11px #0d0f11,0 0 0 12.5px #2b2f31,0 40px 80px rgba(30,34,40,.30)}
  .frame[dir=ltr]{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:116px;height:33px;border-radius:20px;background:#0b0d0e;z-index:30}
  .status{display:flex;align-items:center;justify-content:space-between;padding:15px 28px 0;flex-shrink:0;height:44px}
  .status .t{font-family:'IBM Plex Sans',sans-serif;font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .status .ic{display:flex;align-items:center;gap:6px}
  .home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:rgba(20,24,26,.28);z-index:25}
  .body{flex:1;display:flex;flex-direction:column;padding:4px 20px 10px;min-height:0}

  .head{display:flex;align-items:center;justify-content:space-between;padding-top:2px}
  .h-title{font-size:20px;font-weight:600}
  .h-mark{font-size:15px;font-weight:500;color:var(--muted)}
  .dates{display:flex;align-items:center;gap:11px;margin-top:6px}
  .dates span{font-size:15px;font-weight:500;color:rgba(20,24,26,.74)}
  .dates i{width:1px;height:12px;background:var(--line);display:block}

  .hero{margin-top:12px}
  .hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .hero-l{font-size:15px;color:var(--muted)}
  .acct{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
  .acct b{font-weight:500;color:rgba(20,24,26,.72);letter-spacing:.4px}
  .hero-amt{display:flex;align-items:baseline;gap:7px;margin-top:4px}
  .hero-amt .v{font-size:40px;font-weight:600;line-height:1.02}
  .hero-amt .c{font-size:20px;font-weight:500;color:var(--muted)}
  .hero-sub{font-size:15px;color:var(--muted);margin-top:4px;min-height:17px}

  /* horizon */
  .horizon{margin-top:9px;position:relative}
  .flagrow{display:flex;min-height:34px;position:relative;z-index:2}
  .flagcell{width:15.5556%;position:relative;transition:width .42s cubic-bezier(.22,.61,.36,1)}
  .flag{position:absolute;inset-inline-start:100%;bottom:0;white-space:nowrap;padding-inline-start:8px;padding-bottom:5px;display:flex;flex-direction:column;gap:0;align-items:flex-start}
  /* position mark: a 3px dot straddling the bar's top edge with a 6px hairline
     tether up to the label — points at an instant, does not measure an extent.
     Both are absolute, so the flag row's reserved 34px is unchanged. */
  .flag::before{content:'';position:absolute;inset-inline-start:1.3px;bottom:2px;width:1px;height:4px;background:var(--ink)}
  .flag::after{content:'';position:absolute;inset-inline-start:0.3px;bottom:-1.5px;width:3px;height:3px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--paper)}
  .flag b{font-size:13px;font-weight:600}
  .flag em{font-family:'IBM Plex Sans',sans-serif;font-style:normal;font-size:12px;color:var(--muted)}
  .bar{display:flex;height:64px;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .seg{display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;position:relative;overflow:hidden;transition:width .42s cubic-bezier(.22,.61,.36,1),background-color .42s ease}
  .seg .w{font-size:13px;font-weight:500;white-space:nowrap}
  .seg .a{font-size:13px;font-weight:600;white-space:nowrap}
  .s-spent{background:var(--spent);color:rgba(20,24,26,.62);padding-inline:6px}
  .s-spent .a{font-size:13px}
  /* the wedge never shrinks below 12px: under ~1 000 SAR the true share of the
     month is thinner than a hairline, so the floor keeps the mechanic visible.
     Below the floor the width is a minimum, not a proportion. */
  .s-wedge{background:var(--promised);color:rgba(20,24,26,.74);background-image:repeating-linear-gradient(48deg,transparent 0 5px,rgba(20,24,26,.17) 5px 6.4px);padding:8px 6px;min-width:12px;flex-shrink:0}
  .s-wedge.merged{background:var(--spent);background-image:none;min-width:0;padding-inline:0}
  /* the floor is a floor for a real slice only; at zero it must release,
     or a sliver survives the rollback and steals width from Available */
  .s-wedge.gone{min-width:0;padding-inline:0}
  .s-free{background:var(--avail);color:#fff}
  .s-free .w{color:rgba(255,255,255,.82)}
  .s-free .a{font-size:13px;font-weight:600}
  /* the label's line box is normalised to the sum's, so the gap between them
     does not depend on the script's natural leading */
  .seg .w{line-height:16.7px}
  /* narrow but not blind: the label goes, the sum stays */
  .seg.mute .w,.seg.mute .a{display:none}
  .seg.amt-only .w{display:none}
  .seg.amt-only{justify-content:flex-end}
  /* the limit inside the wedge — divider material, not a state colour.
     1px solid like a list rule; ink at half strength so it survives the hatch.
     The seam is 2px full ink (time); this is 1px half ink (rule). */
  .limitline{position:absolute;top:0;bottom:0;width:1px;background:rgba(20,24,26,.62);z-index:3;display:none}
  .limitline.on{display:block}
  .s-prom{background:var(--promised);color:rgba(20,24,26,.72);background-image:repeating-linear-gradient(48deg,transparent 0 5px,rgba(20,24,26,.17) 5px 6.4px)}
  .seam{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:4;transition:right .42s cubic-bezier(.22,.61,.36,1),left .42s cubic-bezier(.22,.61,.36,1)}
  /* leader + label for a slice too thin to be labelled inside */
  .callrow{position:relative;height:0}
  /* reserved for the whole typing step so crossing the label threshold
     never changes the horizon's geometry; only the label fades */
  /* Reserved only while a callout is actually possible; when the wedge is wide
     enough to label itself the row folds away over the same duration and curve
     as the segment widths, so the collapse reads as part of one movement. */
  .callrow.reserve{height:30px}
  .callrow{transition:height .42s cubic-bezier(.22,.61,.36,1)}
  .call{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;gap:0;opacity:0;transition:opacity .16s ease;pointer-events:none;width:var(--cw,12px)}
  .callrow.on .call{opacity:1}
  .callrow:not(.on) .call{display:none}
  /* dimension annotation: hairline drop + an extent rule as wide as the wedge,
     so the label reads as a measure of the slice, not as loose text */
  .call i{width:1px;height:9px;background:rgba(20,24,26,.42);display:block}
  .call u{display:block;height:1px;background:rgba(20,24,26,.42);width:100%}
  .call span{position:relative}
  .call span{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;margin-top:3px}

  .scale{display:flex;justify-content:space-between;margin-top:3px}
  .scale span{font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0}
  .note{font-size:15px;color:var(--muted);margin-top:5px;min-height:16px;line-height:1.4}
  /* on the failure step the heading below answers "where is my money" directly,
     so the explanatory line above the horizon would only say it twice */
  .note:empty{display:none}
  .note b{font-weight:600;color:var(--ink)}

  /* zone under the horizon — one rule for all four steps:
     content is anchored to the bottom, so every step's action lands
     at the same distance from the nav and the air sits under the horizon */
  .zone{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;margin-top:0}

  /* entry aids (step 0) */
  .after{display:flex;align-items:baseline;justify-content:space-between;padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:#FCFBF9;transition:border-color .16s,background .16s}
  .after.over{border-color:var(--clay);background:#FBF4F1}
  .after-l{font-size:15px;color:var(--muted)}
  .after-v{font-size:20px;font-weight:600;line-height:1}
  .after-v .cu{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
  .after.over .after-l,.after.over .after-v,.after.over .after-v .cu{color:var(--clay)}
  .quick{display:flex;gap:7px;margin-top:6px}
  .quick button{flex:1;border:1px solid var(--line);border-radius:10px;background:none;padding:7px 0;font-size:15px;font-weight:600;color:var(--ink);transition:border-color .14s,background .14s}
  .quick button:hover{border-color:#C8C3B9}
  .quick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .last{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:13px;color:var(--muted)}
  .last b{font-weight:600;color:var(--ink)}
  .last button{background:none;border:none;font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;margin-inline-start:auto}

  /* keypad — hairline grid only */
  .pad{margin-top:6px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
  .k{height:46px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;transition:background-color .12s ease}
  .k:not(:nth-child(3n+1)){border-inline-start:1px solid var(--line)}
  .k:nth-last-child(-n+3){border-bottom:none}
  .k:active{background:rgba(20,24,26,.06)}
  .k.gl{color:var(--muted)}

  /* rows (recipient / route) — same hairline language as the lists */
  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row-l{font-size:13px;color:var(--muted);min-width:62px}
  .row-v{font-size:15px;font-weight:500;margin-inline-start:auto;text-align:end}
  .row.lead .row-v{font-size:20px;font-weight:600}
  .row-check{font-size:13px;color:var(--muted);margin-inline-start:auto}

  .mark{width:3px;flex-shrink:0;border-radius:2px}
  .mark.done{height:10px;background:var(--ink)}
  .mark.now{height:24px;background:var(--ink)}
  .mark.next{height:24px;background:var(--line)}
  .step-n{font-size:15px;font-weight:500}
  .step-n.done{color:var(--muted)}
  .step-n.now{color:var(--ink);font-weight:600}
  .step-n.next{color:rgba(110,118,121,.6)}

  .result{font-size:20px;font-weight:600;padding:14px 0 4px}
  .result-sub{font-size:15px;color:var(--muted);margin-bottom:6px;line-height:1.45}

  .act{margin-top:8px;height:52px;flex:0 0 52px;border-radius:13px;background:var(--ink);color:#fff;border:none;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .16s ease}
  .act:hover{background:#20262a}
  .act.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500}
  .act.ghost:hover{background:rgba(20,24,26,.03)}
  /* leaving the transfer: ghost chrome + the departure glyph */
  .act.leave{background:none;color:var(--ink);border:1px solid var(--line);font-weight:600;margin-top:8px}
  .act.leave:hover{background:rgba(20,24,26,.03)}
  .act.leave svg{flex-shrink:0}
  .act.bare{background:none;border:none;color:var(--muted);font-weight:500;height:40px;flex:0 0 40px;margin-top:2px;text-decoration:underline;text-underline-offset:3px}
  .act.bare:hover{background:none;color:var(--ink)}
  .lim-h{font-size:20px;font-weight:600;line-height:1.3;margin-bottom:5px}
  .lim-p{font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:4px}
  /* the zone anchors content to the bottom for every step; this absorbs the
     slack after the explanation so the heading stays at the top on Limit */
  .lim-rows{margin-bottom:auto}
  .lim-p b{font-weight:600;color:var(--ink)}
  .sending{margin-top:12px;height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:var(--muted)}

  .nav{flex-shrink:0;display:flex;border-top:1px solid var(--line);padding:0 14px 20px}
  .tab{flex:1;background:none;border:none;padding:11px 2px 0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--muted)}
  .tab .rule{width:16px;height:2px;border-radius:2px;background:transparent}
  .tab.on{color:var(--ink);font-weight:600}
  .tab.on .rule{background:var(--ink)}

  /* controls outside the frame */
  .ctl{display:flex;gap:10px;align-items:center}
  .steps,.lang{display:flex;border:1px solid #CFCAC2;border-radius:8px;overflow:hidden;background:#F1EFEA}
  .lang{direction:ltr}
  .steps button,.lang button{border:none;background:none;padding:5px 11px;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:600;color:#767E7D}
  .steps button+button,.lang button+button{border-inline-start:1px solid #CFCAC2}
  .steps button.on,.lang button.on{background:var(--ink);color:#fff}
</style>
</head>
<body>
  <div class="frame" dir="rtl" id="frame">
    <div class="island"></div>
    <div class="status" id="status"></div>
    <div class="body">
      <div class="head">
        <h1 class="h-title" id="t-title"></h1>
        <span class="h-mark" id="t-mark"></span>
      </div>
      <div class="dates">
        <span class="num" id="t-dg"></span>
        <i></i>
        <span class="num" id="t-dh"></span>
      </div>

      <div class="hero">
        <div class="hero-top">
          <div class="hero-l" id="t-hl"></div>
          <div class="acct" id="t-acct"></div>
        </div>
        <div class="hero-amt ltr"><span class="v num" id="t-hv"></span><span class="c">SAR</span></div>
        <div class="hero-sub" id="t-hs"></div>
      </div>

      <div class="horizon">
        <div class="flagrow">
          <div class="flagcell" id="flagcell">
            <div class="flag"><b id="t-today"></b><em class="num" id="t-todayd"></em></div>
          </div>
        </div>
        <div class="bar">
          <div class="seg s-spent" id="g-spent"><span class="w" id="t-s1"></span><span class="a num ltr" id="v-spent"></span></div>
          <div class="seg s-wedge" id="g-wedge"><span class="w" id="t-sw"></span><span class="a num ltr" id="v-wedge"></span><span class="limitline" id="limitline"></span></div>
          <div class="seg s-free" id="g-free"><span class="w" id="t-s2"></span><span class="a num ltr" id="v-free"></span></div>
          <div class="seg s-prom" id="g-prom"><span class="w" id="t-s3"></span><span class="a num ltr">2 200</span></div>
          <div class="seam" id="seam"></div>
        </div>
        <div class="callrow" id="callrow"><div class="call" id="call"><i></i><u></u><span id="t-call"></span></div></div>
        <div class="scale">
          <span class="num" id="t-m1"></span>
          <span class="num" id="t-m2"></span>
        </div>
        <div class="note" id="note"></div>
      </div>

      <div class="zone" id="zone"></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="home"></div>
  </div>

  <div class="ctl">
    <div class="steps" id="steps"></div>
    <div class="lang">
      <button data-l="ar" class="on">ar</button>
      <button data-l="en">en</button>
    </div>
  </div>

<script>
  var TOTAL=9000,SPENT=1400,FREE=5400,PROM=2200;

  /* Recipients live here, not in the link: Month hands over a key only, so no
     name or phone number ever appears in the address bar. */
  var PEOPLE={
    abdullah:{ar:'عبدالله',en:'Abdullah',ini:{ar:'ع',en:'A'},tel:'+966 55 214 3387',g:'m'},
    noura:{ar:'نورة',en:'Noura',ini:{ar:'ن',en:'N'},tel:'+966 50 883 1204',g:'f'},
    faisal:{ar:'فيصل',en:'Faisal',ini:{ar:'ف',en:'F'},tel:'+966 54 671 9350',g:'m'}
  };
  var QP=new URLSearchParams(location.search);
  var REC=PEOPLE[QP.get('r')]||PEOPLE.abdullah;
  var PHONE=REC.tel;
  /* Arabic agrees the beneficiary complement and the imperative suffix with
     the recipient's gender; the route and result verbs agree with المبلغ. */
  var FEM=REC.g==='f';
  var BENE=FEM?'مستفيدةً':'مستفيداً';
  var ACTIVATE=FEM?'وفعّلها':'وفعّله';
  var PRON=FEM?'her':'him';
  var startLang=(QP.get('lang')==='en')?'en':'ar';
  function N(k){return REC[k]}

  var LASTAMT=300,QUICK=[100,300,500];
  var LABEL_MIN=52; /* px a segment needs before its label fits inside */
  var SEG_PAD=20,SPENT_PAD=12,AMT_MIN=36;
  var LIMIT=2500;   /* sarie: quick transfer without an added beneficiary */
  var L={
    ar:{dir:'rtl',title:'الشهر',mark:'أفق',dg:'4 سبتمبر 2026',dh:'22 ربيع الأول 1448 هـ',
      acct:'جاري <b class="ltr">•••• 7742</b>',
      availL:'المتاح الآن',amountL:'المبلغ',
      monthSub:['من إجمالي ',' في الشهر'],
      toSub:'إلى ',
      s:['مصروف','متاح','موعود'],wedge:'محجوز',
      today:'اليوم',todayd:'4 سبتمبر',m1:'1 سبتمبر',m2:'30 سبتمبر',
      notes:{
        amount:'المبلغ يخرج من <b>متاح</b>، لا من الشهر.',
        fail:'',
        confirm:'راجع الاسم قبل الإرسال. المبلغ محجوز ولم يُرسل بعد.',
        wait:'المبلغ ثابت عند حد اليوم حتى يصل.',
        sent:'اندمج المبلغ في <b>مصروف</b>، وتحرّك حد اليوم.',
        limit:'الخط داخل المبلغ هو حد التحويل السريع — <b class="num ltr">2 500 SAR</b>.'
      },
      rec:'المستلم',phone:'الجوال',amt:'المبلغ',
      afterL:'المتاح بعد التحويل',afterOver:'أكبر من المتاح',
      call:function(p){return p+'% من الشهر'},
      lastL:function(a){return 'آخر تحويل ل'+REC.ar+' · <b class="num ltr">'+a+' SAR</b>'},reuse:'إعادة',
      name:REC.ar,
      route:['خُصم من الحساب','شبكة سريع','وصل إلى '+REC.ar],
      sendBtn:'إرسال ',sending:'جارٍ الإرسال',
      resultW:'أُرسل ',resultSub:'وصل إلى '+REC.ar+' · <span class="num ltr">'+PHONE+'</span>',
      back:'العودة إلى الشهر',
      contBtn:'متابعة',nowW:'الآن',
      limH:'المبلغ أعلى من حد التحويل السريع',
      limP:'في شبكة <b>سريع</b>، التحويل بدون إضافة المستفيد محدود. لإرسال المبلغ كاملاً، أضِف '+REC.ar+' '+BENE+' '+ACTIVATE+'.',
      limRow:'حد التحويل السريع',
      addBene:'إضافة '+REC.ar+' '+BENE,
      editAmt:'العودة لتعديل المبلغ',
      failH:'المبلغ بقي معك',
      failP:'لم يكتمل التحويل عبر <b>سريع</b>. حسابك كما هو.',
      retry:'إعادة المحاولة',changeAmt:'تغيير المبلغ',
      tabs:['الشهر','التحويلات','الحساب'],
      stepNames:['مبلغ','تأكيد','انتظار','أُرسل','الحد','فشل']},
    en:{dir:'ltr',title:'Month',mark:'Ufuq',dg:'4 September 2026',dh:'22 Rabi I 1448 AH',
      acct:'Current <b class="ltr">•••• 7742</b>',
      availL:'Available now',amountL:'Amount',
      monthSub:['of ',' this month'],
      toSub:'to ',
      s:['Spent','Available','Promised'],wedge:'Held',
      today:'Today',todayd:'4 September',m1:'1 September',m2:'30 September',
      notes:{
        amount:'Taken from <b>Available</b>, not from the month.',
        fail:'',
        confirm:'Check the name before sending. The amount is held, not sent.',
        wait:'The amount stays fixed at today\'s line until it lands.',
        sent:'The amount merged into <b>Spent</b>, and today\'s line moved.',
        limit:'The line inside the amount is the quick transfer limit — <b class="num ltr">2 500 SAR</b>.'
      },
      rec:'Recipient',phone:'Phone',amt:'Amount',
      afterL:'Available after transfer',afterOver:'More than available',
      call:function(p){return p+'% of month'},
      lastL:function(a){return 'Last to '+REC.en+' · <b class="num ltr">'+a+' SAR</b>'},reuse:'Reuse',
      name:REC.en,
      route:['Debited from account','sarie network','Delivered to '+REC.en],
      sendBtn:'Send ',sending:'Sending',
      resultW:'Sent ',resultSub:'Delivered to '+REC.en+' · <span class="num ltr">'+PHONE+'</span>',
      back:'Back to Month',
      contBtn:'Continue',nowW:'now',
      limH:'This is above the quick transfer limit',
      limP:'On the <b>sarie</b> network, transfers without adding the recipient are capped. To send the full amount, add '+REC.en+' as a beneficiary and activate '+PRON+'.',
      limRow:'Quick transfer limit',
      addBene:'Add '+REC.en+' as beneficiary',
      editAmt:'Back to edit the amount',
      failH:'The money stayed with you',
      failP:'The transfer through <b>sarie</b> didn\'t complete. Your account is unchanged.',
      retry:'Try again',changeAmt:'Change amount',
      tabs:['Month','Transfers','Account'],
      stepNames:['Amount','Confirm','Waiting','Sent','Limit','Failed']}
  };

  var ICONS='<svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".6" fill="#14181A"></rect><rect x="4.5" y="4.7" width="3" height="6.3" rx=".6" fill="#14181A"></rect><rect x="9" y="2.4" width="3" height="8.6" rx=".6" fill="#14181A"></rect><rect x="13.5" y="0" width="3" height="11" rx=".6" fill="#14181A"></rect></svg><svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.8c2.1 0 4 .8 5.4 2.2l1-1C12.7 2.3 10.5 1.3 8 1.3S3.3 2.3 1.6 4l1 1C4 3.6 5.9 2.8 8 2.8Z" fill="#14181A"></path><path d="M8 6c1.2 0 2.3.5 3.1 1.3l1-1C11 5.2 9.6 4.6 8 4.6s-3 .6-4.1 1.7l1 1C5.7 6.5 6.8 6 8 6Z" fill="#14181A"></path><circle cx="8" cy="9.4" r="1.3" fill="#14181A"></circle></svg>';
  function battery(rtl){return rtl
    ?'<svg width="25" height="12" viewBox="0 0 25 12"><rect x="3.5" y=".5" width="21" height="11" rx="3" stroke="#14181A" stroke-opacity=".35" fill="none"></rect><rect x="5" y="2" width="15" height="8" rx="1.8" fill="#14181A"></rect><path d="M2 4v4c-.7-.3-1.2-1-1.2-2S1.3 4.3 2 4Z" fill="#14181A" fill-opacity=".45"></path></svg>'
    :'<svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="#14181A" stroke-opacity=".35" fill="none"></rect><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#14181A"></rect><path d="M23 4v4c.7-.3 1.2-1 1.2-2S23.7 4.3 23 4Z" fill="#14181A" fill-opacity=".45"></path></svg>';}

  var lang=startLang,step=0,amount='500',timer=null;
  /* departure glyph — marks a button that leaves the transfer */
  var EXT='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8.5 8.5M18 13.5V18a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4.5"/></svg>';
  function grp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')}
  function set(id,v){document.getElementById(id).textContent=v}
  function html(id,v){document.getElementById(id).innerHTML=v}
  function pct(v){return (v/TOTAL*100)}

  function amountNum(){return Math.min(parseInt(amount||'0',10)||0,FREE)}

  /* The rule must equal the wedge exactly, and the wedge's real edge is not
     computable from its percentage: below the 12px floor flex-shrink moves it.
     So the annotation is anchored to the wedge's measured rect and re-read
     while the width transition runs. The label centres on the rule and is
     nudged back inside the bar when it would hang off the end. */
  /* Labels are gated on the segment's MEASURED inner width, re-read while the
     width transition runs, so a segment that is still narrower than the
     threshold stays silent instead of showing clipped text for ~150ms. */
  function syncMute(){
    var sent=step===3,failed=step===5;
    [['g-spent',AMT_MIN],['g-wedge',null],['g-free',null],['g-prom',null]].forEach(function(p){
      var e=document.getElementById(p[0]),c=getComputedStyle(e);
      var inner=e.getBoundingClientRect().width-parseFloat(c.paddingLeft)-parseFloat(c.paddingRight);
      if(p[0]==='g-wedge'){e.classList.toggle('mute',sent||failed||inner<LABEL_MIN);return}
      if(p[1]!==null){
        e.classList.toggle('mute',inner<p[1]);
        e.classList.toggle('amt-only',inner>=p[1]&&inner<LABEL_MIN);
        return;
      }
      e.classList.toggle('mute',inner<LABEL_MIN);
    });
  }

  /* the width transition also drives the gate directly, so labels re-evaluate
     even if the rAF window is throttled */
  document.addEventListener('DOMContentLoaded',function(){
    var bar=document.querySelector('.bar');
    if(bar)['transitionrun','transitionend'].forEach(function(ev){
      bar.addEventListener(ev,function(){syncMute();syncCall()},true);
    });
  });
  window.__syncMute=function(){syncMute()};

  function syncCall(){
    var row=document.getElementById('callrow');
    if(!row.classList.contains('on'))return;
    var c=document.getElementById('call'),w=document.getElementById('g-wedge'),
        bar=document.querySelector('.bar'),sp=document.getElementById('t-call');
    var wr=w.getBoundingClientRect(),br=bar.getBoundingClientRect();
    var rtl=getComputedStyle(document.getElementById('frame')).direction==='rtl';
    c.style.transform='none';
    c.style.insetInlineStart=(rtl?br.right-wr.right:wr.left-br.left)+'px';
    c.style.setProperty('--cw',wr.width+'px');
    sp.style.transform='translateX(0px)';
    var spr=sp.getBoundingClientRect(),nudge=0;
    if(spr.left<br.left)nudge=br.left-spr.left;
    else if(spr.right>br.right)nudge=br.right-spr.right;
    if(nudge)sp.style.transform='translateX('+nudge+'px)';
  }
  var syncUntil=0,syncing=false;
  function syncLoop(){
    syncCall();syncMute();
    if(performance.now()<syncUntil)requestAnimationFrame(syncLoop);
    else syncing=false;
  }
  function trackCall(){
    syncUntil=performance.now()+900;
    if(!syncing){syncing=true;requestAnimationFrame(syncLoop)}
  }

  function paint(){
    var d=L[lang],rtl=d.dir==='rtl',a=amountNum(),sent=step===3,failed=step===5;
    var spentV=sent?SPENT+a:SPENT, freeV=sent?FREE-a:FREE-a;
    var seamPct=pct(sent?SPENT+a:SPENT);

    /* On Sent the slice is not recoloured in place — it is absorbed: Spent takes
       its width and the slice goes to zero in the same frame, so the shared
       0.42s width transition slides the seam across it while its far edge
       stays put. The material swap lands first (merged is toggled before the
       widths), which reads as "filled, then swallowed" rather than "shrank". */
    /* Failure is the reverse movement, not another outcome painted on top:
       the slice keeps its held material and simply retreats to zero while
       Available grows back into it. No merged class — nothing was spent. */
    document.getElementById('g-wedge').classList.toggle('merged',sent);
    document.getElementById('g-wedge').classList.toggle('gone',sent||failed);
    document.getElementById('g-spent').style.width=pct(sent?spentV:SPENT)+'%';
    document.getElementById('g-wedge').style.width=pct(sent||failed?0:a)+'%';
    document.getElementById('g-free').style.width=pct(failed?FREE:FREE-a)+'%';
    document.getElementById('g-prom').style.width=pct(PROM)+'%';
    document.getElementById('flagcell').style.width=seamPct+'%';
    var seam=document.getElementById('seam');
    seam.style.right=rtl?seamPct+'%':'auto';
    seam.style.left=rtl?'auto':seamPct+'%';

    /* the limit sits INSIDE the wedge: left of it leaves now,
       right of it needs the recipient added. Divider material, not colour. */
    var overLimit=a>LIMIT&&!sent&&!failed;
    var ll=document.getElementById('limitline');
    ll.classList.toggle('on',overLimit);
    if(overLimit)ll.style.insetInlineStart=(LIMIT/a*100)+'%';

    set('v-spent',grp(spentV));
    set('v-wedge',a?grp(a):'');
    /* Available speaks the sum while the hero is taken by the typed amount,
       and the share once the hero returns to the balance */
    set('v-free',sent?(pct(FREE-a)).toFixed(0)+'%':grp(failed?FREE:FREE-a));
    set('t-sw',a?d.wedge:'');

    /* label fits inside only above a px threshold; a slice thinner than
       that keeps its minimum width and speaks through a leader below */
    /* the threshold measures the segment's INNER width — full width would
       pass a segment whose padding leaves no room for the text */
    var bw=document.querySelector('.bar').clientWidth||348;
    function fits(w){return w*bw/100-SEG_PAD>=LABEL_MIN}
    var sendPx=Math.max(pct(a)/100*bw,a>0?12:0);
    /* Spent carries tighter padding, so its threshold is its own: too narrow
       for the label, still wide enough for the sum — hence amt-only */
    var spentInner=pct(sent?spentV:spentV)/100*bw-SPENT_PAD;
    var gs=document.getElementById('g-spent');
    gs.classList.toggle('mute',spentInner<AMT_MIN);
    gs.classList.toggle('amt-only',spentInner>=AMT_MIN&&spentInner<LABEL_MIN);
    document.getElementById('g-wedge').classList.toggle('mute',sent||failed||sendPx-SEG_PAD<LABEL_MIN);
    syncMute();trackCall();
    document.getElementById('g-free').classList.toggle('mute',!fits(pct(failed?FREE:FREE-a)));
    document.getElementById('g-prom').classList.toggle('mute',!fits(pct(PROM)));

    var thin=a>0&&sendPx-SEG_PAD<LABEL_MIN&&!sent&&!failed;
    var cr=document.getElementById('callrow');
    cr.classList.toggle('on',thin);
    /* height is held only while the callout is actually shown; the fold is
       animated on the segments' own curve so it reads as one movement */
    cr.classList.toggle('reserve',thin);
    if(thin){
      set('t-call',d.call(pct(a)<1?'<1':pct(a).toFixed(1).replace(/\.0$/,'')));
      syncCall();trackCall();
    }

    // hero: the typed amount IS the hero number until it is sent
    if(sent){
      set('t-hl',d.availL);set('t-hv',grp(FREE-a));
      html('t-hs',d.monthSub[0]+'<span class="num ltr">'+grp(TOTAL)+' SAR</span>'+d.monthSub[1]);
    }else{
      set('t-hl',d.amountL);set('t-hv',grp(a));
      html('t-hs',d.toSub+d.name+' · <span class="num ltr">'+PHONE+'</span>');
    }
    html('note',[d.notes.amount,d.notes.confirm,d.notes.wait,d.notes.sent,d.notes.limit,d.notes.fail][step]);
    zone();
  }

  function zone(){
    var d=L[lang],a=amountNum(),z=document.getElementById('zone'),h='';
    if(step===0){
      var over=(parseInt(amount||'0',10)||0)>FREE;
      h='<div class="after'+(over?' over':'')+'">'+
          '<span class="after-l">'+(over?d.afterOver:d.afterL)+'</span>'+
          '<span class="after-v num ltr">'+grp(FREE-a)+'<span class="cu">SAR</span></span>'+
        '</div>'+
        '<div class="quick">'+QUICK.map(function(v){
          return '<button data-v="'+v+'"'+(a===v?' class="on"':'')+'><span class="num ltr">'+grp(v)+'</span></button>';
        }).join('')+'</div>'+
        '<div class="last"><span>'+d.lastL(grp(LASTAMT))+'</span><button data-reuse="1">'+d.reuse+'</button></div>';
      var keys=['1','2','3','4','5','6','7','8','9','.','0','⌫'];
      h+='<div class="pad">'+keys.map(function(k){
        var gl=(k==='.'||k==='⌫')?' gl':'';
        return '<button class="k'+gl+'" data-k="'+k+'">'+k+'</button>';
      }).join('')+'</div>'+
      '<button class="act" id="go">'+d.contBtn+'</button>';
    }else if(step===4){
      h='<div class="lim-h">'+d.limH+'</div>'+
        '<div class="lim-p">'+d.limP+'</div>'+
        '<div class="rows lim-rows">'+
          '<div class="row"><span class="row-l">'+d.limRow+'</span><span class="row-v num ltr">'+grp(LIMIT)+' SAR</span></div>'+
          '<div class="row"><span class="row-l">'+d.amt+'</span><span class="row-v num ltr">'+grp(a)+' SAR</span></div>'+
        '</div>'+
        '<button class="act" data-act="sendlimit">'+d.sendBtn+'<span class="num ltr">'+grp(LIMIT)+' SAR</span> '+d.nowW+'</button>'+
        '<button class="act leave" data-act="add">'+EXT+'<span>'+d.addBene+'</span></button>'+
        '<button class="act bare" data-act="edit">'+d.editAmt+'</button>';
    }else if(step===5){
      h='<div class="lim-h">'+d.failH+'</div>'+
        '<div class="lim-p">'+d.failP+'</div>'+
        '<div class="rows lim-rows">'+
          '<div class="row"><span class="row-l">'+d.rec+'</span><span class="row-v">'+d.name+'</span></div>'+
          '<div class="row"><span class="row-l">'+d.amt+'</span><span class="row-v num ltr">'+grp(a)+' SAR</span></div>'+
        '</div>'+
        '<button class="act" data-act="retry">'+d.retry+'</button>'+
        '<button class="act bare" data-act="edit">'+d.changeAmt+'</button>';
    }else if(step===1){
      h='<div class="rows">'+
        '<div class="row lead"><span class="row-l">'+d.rec+'</span><span class="row-v">'+d.name+'</span></div>'+
        '<div class="row"><span class="row-l">'+d.phone+'</span><span class="row-v num ltr">'+PHONE+'</span></div>'+
        '<div class="row"><span class="row-l">'+d.amt+'</span><span class="row-v num ltr">'+grp(a)+' SAR</span></div>'+
        '</div>'+
        '<button class="act" id="go">'+d.sendBtn+'<span class="num ltr">'+grp(a)+' SAR</span></button>';
    }else if(step===2){
      var st=['done','now','next'];
      h='<div class="rows">'+d.route.map(function(r,i){
        return '<div class="row"><span class="mark '+st[i]+'"></span><span class="step-n '+st[i]+'">'+r+'</span></div>';
      }).join('')+'</div>'+
      '<div class="sending">'+d.sending+'</div>';
    }else{
      h='<div class="result">'+d.resultW+'<span class="num ltr">'+grp(a)+' SAR</span></div>'+
        '<div class="result-sub">'+d.resultSub+'</div>'+
        '<div class="rows">'+d.route.map(function(r){
          return '<div class="row"><span class="mark done"></span><span class="step-n done">'+r+'</span></div>';
        }).join('')+'</div>'+
        '<button class="act ghost" id="go">'+d.back+'</button>';
    }
    z.innerHTML=h;

    var go=document.getElementById('go');
    if(go)go.onclick=function(){
      if(step===0)setStep(amountNum()>LIMIT?4:1);
      else if(step===1)setStep(2);
      else setStep(0);
    };
    /* send what the channel allows now */
    var sl=z.querySelector('[data-act="sendlimit"]');
    if(sl)sl.onclick=function(){amount=String(LIMIT);setStep(1)};
    /* return to the amount KEEPS what was typed */
    var ed=z.querySelector('[data-act="edit"]');
    if(ed)ed.onclick=function(){setStep(0)};
    /* retry re-runs the same amount through the channel */
    var rt=z.querySelector('[data-act="retry"]');
    if(rt)rt.onclick=function(){setStep(2)};
    [].slice.call(z.querySelectorAll('.quick button')).forEach(function(b){
      b.onclick=function(){amount=b.dataset.v;paint()};
    });
    var re=z.querySelector('[data-reuse]');
    if(re)re.onclick=function(){amount=String(LASTAMT);paint()};
    [].slice.call(z.querySelectorAll('.k')).forEach(function(b){
      b.onclick=function(){
        var k=b.dataset.k;
        if(k==='⌫')amount=amount.length<=1?'0':amount.slice(0,-1);
        else if(k==='.')return;
        else amount=(amount==='0'?'':amount)+k;
        if(amount.length>5)amount=amount.slice(0,5);
        paint();
      };
    });
  }

  function setStep(n){
    if(timer){clearTimeout(timer);timer=null}
    step=n;
    /* the limit state only exists above the limit */
    if(n===4&&(parseInt(amount||'0',10)||0)<=LIMIT)amount='3000';
    [].slice.call(document.querySelectorAll('.steps button')).forEach(function(b,i){
      b.classList.toggle('on',i===n);
    });
    paint();
    if(n===2)timer=setTimeout(function(){setStep(3)},1900);
  }

  function render(k){
    lang=k;var d=L[k],rtl=d.dir==='rtl';
    document.getElementById('frame').setAttribute('dir',d.dir);
    document.documentElement.setAttribute('lang',k);
    document.getElementById('status').innerHTML='<span class="t">9:41</span><div class="ic">'+ICONS+battery(rtl)+'</div>';
    set('t-title',d.title);set('t-mark',d.mark);set('t-dg',d.dg);set('t-dh',d.dh);
    html('t-acct',d.acct);
    set('t-s1',d.s[0]);set('t-s2',d.s[1]);set('t-s3',d.s[2]);
    set('t-today',d.today);set('t-todayd',d.todayd);
    set('t-m1',d.m1);set('t-m2',d.m2);
    document.getElementById('nav').innerHTML=d.tabs.map(function(t,i){
      return '<button class="tab'+(i===0?' on':'')+'"><span class="rule"></span>'+t+'</button>';
    }).join('');
    document.getElementById('steps').innerHTML=d.stepNames.map(function(s,i){
      return '<button'+(i===step?' class="on"':'')+'>'+s+'</button>';
    }).join('');
    [].slice.call(document.querySelectorAll('.steps button')).forEach(function(b,i){
      b.addEventListener('click',function(){setStep(i)});
    });
    paint();
  }

  [].slice.call(document.querySelectorAll('.lang button')).forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.lang button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      render(b.dataset.l);
    });
  });

  /* the arriving lang also sets the toggle, so the control matches the screen */
  [].slice.call(document.querySelectorAll('.lang button')).forEach(function(b){
    b.classList.toggle('on',b.dataset.l===startLang);
  });
  render(startLang);
</script>
</body>
</html>
