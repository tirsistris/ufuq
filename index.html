<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أفق — الشهر</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#F7F5F1;--ink:#14181A;--muted:#6E7679;--avail:#0B4F55;--line:#E2DED7;--clay:#9C4A2F;--spent:#D8D5CF;--promised:#EFEBE4}
  /* --avail alternates: olive #4C5622 · oxblood #6E2438 */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;letter-spacing:0;-webkit-font-smoothing:antialiased;background:#E8E6E1;display:flex;align-items:center;justify-content:center;gap:22px;flex-direction:column;overflow:hidden}
  button{font-family:inherit;letter-spacing:0;cursor:pointer}
  .num{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .cap{display:flex;flex-direction:column;align-items:center;gap:4px}
  .cap-a{font-size:19px;font-weight:600;color:var(--ink);font-family:'IBM Plex Sans',sans-serif}
  .cap-b{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:#78807F}

  /* frame */
  .frame{width:390px;height:844px;border-radius:54px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 11px #0d0f11,0 0 0 12.5px #2b2f31,0 40px 80px rgba(30,34,40,.30)}
  .frame[dir=ltr]{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:116px;height:33px;border-radius:20px;background:#0b0d0e;z-index:30}
  .status{display:flex;align-items:center;justify-content:space-between;padding:15px 28px 0;flex-shrink:0;height:44px}
  .status .t{font-family:'IBM Plex Sans',sans-serif;font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .status .ic{display:flex;align-items:center;gap:6px}
  .home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:rgba(20,24,26,.28);z-index:25}
  .body{flex:1;display:flex;flex-direction:column;padding:4px 20px 10px;min-height:0}

  /* header */
  .head{display:flex;align-items:center;justify-content:space-between;padding-top:2px}
  .h-title{font-size:21px;font-weight:600}
  .h-mark{font-size:13.5px;font-weight:500;color:var(--muted)}
  .dates{display:flex;align-items:center;gap:11px;margin-top:6px}
  .dates span{font-size:13px;font-weight:500;color:rgba(20,24,26,.74)}
  .dates i{width:1px;height:12px;background:var(--line);display:block}

  /* hero */
  .hero{margin-top:12px}
  .hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .hero-l{font-size:13.5px;color:var(--muted)}
  .acct{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
  .acct b{font-weight:500;color:rgba(20,24,26,.72);letter-spacing:.4px}
  .hero-amt{display:flex;align-items:baseline;gap:7px;margin-top:4px}
  .hero-amt .v{font-size:38px;font-weight:600;line-height:1.02}
  .hero-amt .c{font-size:18px;font-weight:500;color:var(--muted)}
  .hero-sub{font-size:12.5px;color:var(--muted);margin-top:4px}

  /* horizon */
  .horizon{margin-top:9px;position:relative}
  .flagrow{display:flex;min-height:34px}
  .flagcell{width:15.5556%;position:relative}
  .flag{position:absolute;inset-inline-start:100%;bottom:0;white-space:nowrap;padding-inline-start:8px;border-inline-start:2px solid var(--ink);display:flex;flex-direction:column;gap:1px;align-items:flex-start}
  .flag b{font-size:12px;font-weight:600}
  .flag em{font-family:'IBM Plex Sans',sans-serif;font-style:normal;font-size:11px;color:var(--muted)}
  .bar{display:flex;height:64px;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .seg{display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;position:relative;transition:filter .16s ease;cursor:pointer}
  .seg .w{font-size:11.5px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .seg .a{font-size:13px;font-weight:600;white-space:nowrap}
  .s-spent{width:15.5556%;background:var(--spent);color:rgba(20,24,26,.62)}
  .s-spent .a{font-size:12px}
  .s-free{width:60%;background:var(--avail);color:#fff}
  .s-free .w{color:rgba(255,255,255,.82)}
  .s-free .a{font-size:16px;font-weight:600}
  .s-prom{width:24.4444%;background:var(--promised);color:rgba(20,24,26,.72);background-image:repeating-linear-gradient(48deg,transparent 0 5px,rgba(20,24,26,.17) 5px 6.4px)}
  .seam{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:4}
  .seg.dim{filter:saturate(.55) opacity(.5)}
  .caret{width:9px;height:9px;flex-shrink:0;opacity:.65}
  .scale{display:flex;justify-content:space-between;margin-top:5px}
  .scale span{font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px;line-height:1.4}
  .note b{font-weight:600;color:var(--ink)}

  /* list */
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;margin-bottom:1px}
  .sec h2{font-size:15px;font-weight:600}
  .sec .m{font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--muted)}
  .listwrap{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
  .listwrap::-webkit-scrollbar{display:none}
  .ob{display:flex;align-items:center;gap:11px;padding:6px 0;border-bottom:1px solid var(--line)}
  .ob:last-child{border-bottom:none}
  .hatch{width:3px;height:24px;flex-shrink:0;border-radius:2px;background:var(--promised);background-image:repeating-linear-gradient(48deg,transparent 0 3px,rgba(20,24,26,.34) 3px 4.2px)}
  .solid{width:3px;height:24px;flex-shrink:0;border-radius:2px;background:#C9C5BE}
  .ob-n{font-size:13.5px;font-weight:500}
  .ob-d{font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;color:var(--muted);margin-top:1px}
  .ob-d .soon{color:var(--clay);font-weight:600}
  .ob-a{margin-inline-start:auto;font-size:14px;font-weight:600}
  .ob-a.past{color:rgba(20,24,26,.55);font-weight:500}

  /* quick send */
  .send{display:flex;gap:9px;margin-top:3px}
  .r{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:none;text-align:start;transition:border-color .16s ease}
  .r:hover{border-color:#C8C3B9}
  .r .mono{width:29px;height:29px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:rgba(20,24,26,.7)}
  .r .n{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* action */
  .act{margin-top:12px;height:52px;flex:0 0 52px;border-radius:13px;background:var(--ink);color:#fff;border:none;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .16s ease}
  .act:hover{background:#20262a}
  .act:active{background:#0b0d0e}

  /* tab bar — type only, no fills */
  .nav{flex-shrink:0;display:flex;border-top:1px solid var(--line);padding:0 14px 20px}
  .tab{flex:1;background:none;border:none;padding:11px 2px 0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted);transition:color .14s ease}
  .tab:hover{color:rgba(20,24,26,.7)}
  .tab .rule{width:16px;height:2px;border-radius:2px;background:transparent}
  .tab.on{color:var(--ink);font-weight:600}
  .tab.on .rule{background:var(--ink)}

  /* lang toggle — outside the frame, never in a screen capture */
  .lang{display:flex;border:1px solid #CFCAC2;border-radius:8px;overflow:hidden;direction:ltr;background:#F1EFEA}
  .lang button{border:none;background:none;padding:5px 11px;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:600;color:#767E7D;transition:background .14s ease,color .14s ease}
  .lang button+button{border-left:1px solid #CFCAC2}
  .lang button.on{background:var(--ink);color:#fff}
</style>
</head>
<body>
  <div class="frame" dir="rtl" id="frame">
    <div class="island"></div>
    <div class="status" id="status"></div>
    <div class="body">
      <div class="head">
        <h1 class="h-title" id="t-title"></h1>
        <span class="h-mark" id="t-mark"></span>
      </div>
      <div class="dates">
        <span class="num" id="t-dg"></span>
        <i></i>
        <span class="num" id="t-dh"></span>
      </div>

      <div class="hero">
        <div class="hero-top">
          <div class="hero-l" id="t-hl"></div>
          <div class="acct" id="t-acct"></div>
        </div>
        <div class="hero-amt ltr"><span class="v num">5 400</span><span class="c">SAR</span></div>
        <div class="hero-sub" id="t-hs"></div>
      </div>

      <div class="horizon">
        <div class="flagrow" id="flagrow">
          <div class="flagcell">
            <div class="flag"><b id="t-today"></b><em class="num" id="t-todayd"></em></div>
          </div>
        </div>
        <div class="bar" id="bar">
          <div class="seg s-spent" data-k="spent">
            <span class="w"><span id="t-s1"></span><svg class="caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3.2 5 7l4-3.8"></path></svg></span>
            <span class="a num ltr">1 400</span>
          </div>
          <div class="seg s-free" data-k="free"><span class="w" id="t-s2"></span><span class="a num ltr">60%</span></div>
          <div class="seg s-prom" data-k="prom"><span class="w" id="t-s3"></span><span class="a num ltr">2 200</span></div>
          <div class="seam" id="seam"></div>
        </div>
        <div class="scale">
          <span class="num" id="t-m1"></span>
          <span class="num" id="t-m2"></span>
        </div>
        <div class="note" id="note"></div>
      </div>

      <div class="sec">
        <h2 id="t-obt"></h2>
        <span class="m ltr" id="t-obtotal"></span>
      </div>
      <div class="listwrap"><div id="obs"></div></div>

      <div class="sec"><h2 id="t-qst"></h2></div>
      <div class="send" id="send"></div>

      <button class="act">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="1.3" fill="#fff"></circle><circle cx="12" cy="6" r="1.3" fill="#fff"></circle><circle cx="18" cy="6" r="1.3" fill="#fff"></circle><circle cx="6" cy="12" r="1.3" fill="#fff"></circle><circle cx="12" cy="12" r="1.3" fill="#fff"></circle><circle cx="18" cy="12" r="1.3" fill="#fff"></circle><circle cx="9" cy="18" r="1.3" fill="#fff"></circle><circle cx="15" cy="18" r="1.3" fill="#fff"></circle></svg>
        <span id="t-act"></span>
      </button>
    </div>
    <div class="nav" id="nav"></div>
    <div class="home"></div>
  </div>

  <div class="cap">
    <span class="cap-a" id="cap-a"></span>
    <span class="cap-b" id="cap-b"></span>
  </div>
  <div class="lang">
    <button data-l="ar" class="on">ar</button>
    <button data-l="en">en</button>
  </div>

<script>
  var L={
    ar:{
      dir:'rtl',title:'الشهر',mark:'أفق',
      dg:'4 سبتمبر 2026',dh:'—— هجري',
      hl:'المتاح الآن',acct:'جاري <b class="ltr">•••• 7742</b>',
      hs:['من إجمالي ',' في الشهر'],
      s:['مصروف','متاح','موعود'],
      today:'اليوم',todayd:'4 سبتمبر',
      m1:'1 سبتمبر',m2:'30 سبتمبر',
      note:'الحد بين <b>مصروف</b> و<b>متاح</b> هو اليوم. الموعود على الحساب، لكنه ليس لك.',
      drill:{
        spent:'<b>مصروف</b> — <span class="num ltr">1 400 SAR</span> · 16% من الشهر. خلف اليوم، انتهى.',
        free:'<b>متاح</b> — <span class="num ltr">5 400 SAR</span> · 60% من الشهر. هذا وحده لك الآن.',
        prom:'<b>موعود</b> — <span class="num ltr">2 200 SAR</span> · 24% من الشهر. على الحساب، لكنه محسوب لغيرك.'
      },
      obt:'التزامات قادمة',obtotal:'2 200 SAR',
      obs:[['قسط السيارة','8 سبتمبر','بعد 4 أيام','850'],['تأمين طبي','15 سبتمبر','','620'],['رسوم المدرسة','22 سبتمبر','','480'],['اشتراكات','28 سبتمبر','','250']],
      spentT:'ما صُرف حتى الآن',spentTotal:'1 400 SAR',
      spentList:[['نقل','4 سبتمبر','250'],['مطعم','3 سبتمبر','180'],['وقود','3 سبتمبر','145'],['بقالة','2 سبتمبر','320'],['كهرباء','1 سبتمبر','410'],['صيدلية','1 سبتمبر','95']],
      qst:'إرسال سريع',
      send:[['ع','عبدالله','abdullah'],['ن','نورة','noura'],['ف','فيصل','faisal']],
      act:'تحويل برقم الجوال',
      tabs:['الشهر','التحويلات','الحساب'],
      capA:'أفق — الشهر',capB:'iPhone 390×844 · RTL · light'
    },
    en:{
      dir:'ltr',title:'Month',mark:'Ufuq',
      dg:'4 September 2026',dh:'—— Hijri',
      hl:'Available now',acct:'Current <b class="ltr">•••• 7742</b>',
      hs:['of ',' this month'],
      s:['Spent','Available','Promised'],
      today:'Today',todayd:'4 September',
      m1:'1 September',m2:'30 September',
      note:'The line between <b>Spent</b> and <b>Available</b> is today. Promised sits in the account, but it isn\'t yours.',
      drill:{
        spent:'<b>Spent</b> — <span class="num ltr">1 400 SAR</span> · 16% of the month. Behind today, done.',
        free:'<b>Available</b> — <span class="num ltr">5 400 SAR</span> · 60% of the month. This alone is yours now.',
        prom:'<b>Promised</b> — <span class="num ltr">2 200 SAR</span> · 24% of the month. In the account, spoken for.'
      },
      obt:'Upcoming commitments',obtotal:'2 200 SAR',
      obs:[['Car instalment','8 September','in 4 days','850'],['Health insurance','15 September','','620'],['School fees','22 September','','480'],['Subscriptions','28 September','','250']],
      spentT:'Spent so far',spentTotal:'1 400 SAR',
      spentList:[['Transport','4 September','250'],['Dining','3 September','180'],['Fuel','3 September','145'],['Groceries','2 September','320'],['Electricity','1 September','410'],['Pharmacy','1 September','95']],
      qst:'Quick send',
      send:[['A','Abdullah','abdullah'],['N','Noura','noura'],['F','Faisal','faisal']],
      act:'Transfer by phone number',
      tabs:['Month','Transfers','Account'],
      capA:'Ufuq — Month',capB:'iPhone 390×844 · LTR · light'
    }
  };

  var ICONS='<svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".6" fill="#14181A"></rect><rect x="4.5" y="4.7" width="3" height="6.3" rx=".6" fill="#14181A"></rect><rect x="9" y="2.4" width="3" height="8.6" rx=".6" fill="#14181A"></rect><rect x="13.5" y="0" width="3" height="11" rx=".6" fill="#14181A"></rect></svg><svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.8c2.1 0 4 .8 5.4 2.2l1-1C12.7 2.3 10.5 1.3 8 1.3S3.3 2.3 1.6 4l1 1C4 3.6 5.9 2.8 8 2.8Z" fill="#14181A"></path><path d="M8 6c1.2 0 2.3.5 3.1 1.3l1-1C11 5.2 9.6 4.6 8 4.6s-3 .6-4.1 1.7l1 1C5.7 6.5 6.8 6 8 6Z" fill="#14181A"></path><circle cx="8" cy="9.4" r="1.3" fill="#14181A"></circle></svg>';
  function battery(rtl){
    return rtl
      ? '<svg width="25" height="12" viewBox="0 0 25 12"><rect x="3.5" y=".5" width="21" height="11" rx="3" stroke="#14181A" stroke-opacity=".35" fill="none"></rect><rect x="5" y="2" width="15" height="8" rx="1.8" fill="#14181A"></rect><path d="M2 4v4c-.7-.3-1.2-1-1.2-2S1.3 4.3 2 4Z" fill="#14181A" fill-opacity=".45"></path></svg>'
      : '<svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="#14181A" stroke-opacity=".35" fill="none"></rect><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#14181A"></rect><path d="M23 4v4c.7-.3 1.2-1 1.2-2S23.7 4.3 23 4Z" fill="#14181A" fill-opacity=".45"></path></svg>';
  }

  var cur=null,lang='ar';
  function set(id,v){document.getElementById(id).textContent=v}
  function html(id,v){document.getElementById(id).innerHTML=v}

  function commitments(){
    var d=L[lang];
    set('t-obt',d.obt);set('t-obtotal',d.obtotal);
    document.getElementById('obs').innerHTML=d.obs.map(function(o){
      return '<div class="ob"><span class="hatch"></span><div><div class="ob-n">'+o[0]+'</div>'+
        '<div class="ob-d"><span>'+o[1]+'</span>'+(o[2]?' · <span class="soon">'+o[2]+'</span>':'')+'</div></div>'+
        '<span class="ob-a num ltr">'+o[3]+'</span></div>';
    }).join('');
  }
  function spentHistory(){
    var d=L[lang];
    set('t-obt',d.spentT);set('t-obtotal',d.spentTotal);
    document.getElementById('obs').innerHTML=d.spentList.map(function(o){
      return '<div class="ob"><span class="solid"></span><div><div class="ob-n">'+o[0]+'</div>'+
        '<div class="ob-d">'+o[1]+'</div></div>'+
        '<span class="ob-a past num ltr">'+o[2]+'</span></div>';
    }).join('');
  }

  function render(k){
    lang=k;var d=L[k],rtl=d.dir==='rtl';
    var f=document.getElementById('frame');
    f.setAttribute('dir',d.dir);
    document.documentElement.setAttribute('lang',k);

    document.getElementById('status').innerHTML=
      '<span class="t">9:41</span><div class="ic">'+ICONS+battery(rtl)+'</div>';

    set('t-title',d.title);set('t-mark',d.mark);
    set('t-dg',d.dg);set('t-dh',d.dh);
    set('t-hl',d.hl);html('t-acct',d.acct);
    html('t-hs',d.hs[0]+'<span class="num ltr">9 000 SAR</span>'+d.hs[1]);
    set('t-s1',d.s[0]);set('t-s2',d.s[1]);set('t-s3',d.s[2]);
    set('t-today',d.today);set('t-todayd',d.todayd);
    set('t-m1',d.m1);set('t-m2',d.m2);
    set('t-qst',d.qst);set('t-act',d.act);
    set('cap-a',d.capA);set('cap-b',d.capB);

    var seam=document.getElementById('seam');
    seam.style.right=rtl?'15.5556%':'auto';
    seam.style.left=rtl?'auto':'15.5556%';

    document.getElementById('send').innerHTML=d.send.map(function(s){
      return '<button class="r" data-r="'+s[2]+'"><span class="mono">'+s[0]+'</span><span class="n">'+s[1]+'</span></button>';
    }).join('');
    /* the key travels, the person's data does not: no name or number in the URL */
    [].slice.call(document.querySelectorAll('#send .r')).forEach(function(b){
      b.onclick=function(){
        location.href='Ufuq%20Transfer.html?r='+encodeURIComponent(b.dataset.r)+'&lang='+lang;
      };
    });

    document.getElementById('nav').innerHTML=d.tabs.map(function(t,i){
      return '<button class="tab'+(i===0?' on':'')+'"><span class="rule"></span>'+t+'</button>';
    }).join('');

    cur=null;
    html('note',d.note);
    commitments();
    bindSegs();
  }

  function bindSegs(){
    var segs=[].slice.call(document.querySelectorAll('.seg'));
    segs.forEach(function(s){
      s.onclick=function(){
        var k=s.dataset.k;
        if(cur===k){
          cur=null;html('note',L[lang].note);
          segs.forEach(function(x){x.classList.remove('dim')});
          commitments();
          return;
        }
        cur=k;html('note',L[lang].drill[k]);
        segs.forEach(function(x){x.classList.toggle('dim',x!==s)});
        if(k==='spent'){spentHistory()}else{commitments()}
      };
    });
  }

  [].slice.call(document.querySelectorAll('.lang button')).forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.lang button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      render(b.dataset.l);
    });
  });

  render('ar');
</script>
</body>
</html>
